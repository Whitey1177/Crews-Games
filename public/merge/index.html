<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crew</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#fdf1dc;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:#5a3b1c;overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:10px 10px 8px}
header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.box{background:#fff8ec;border:3px solid #e8c48f;border-radius:16px;padding:4px 12px;text-align:center;min-width:84px;box-shadow:0 3px 0 #e8c48f}
.lbl{font-size:11px;font-weight:800;opacity:.65;letter-spacing:.08em}
.val{font-size:22px;font-weight:900;line-height:1.15}
#nextE{height:30px;display:flex;justify-content:center;align-items:center}#nextE img{width:28px!important;height:28px!important}
#stage{flex:1;width:100%;max-width:440px;display:flex;align-items:flex-start;justify-content:center;min-height:0}
#c{display:block;border-radius:22px;box-shadow:0 6px 0 #d9a868,0 10px 24px rgba(120,70,20,.18);touch-action:none}
#evo{display:flex;gap:2px;margin-top:10px;font-size:19px;align-items:center;flex-wrap:nowrap;opacity:.9}
#evo span.arrow{font-size:10px;opacity:.5}#evo canvas{display:block}
#over{position:fixed;inset:0;background:rgba(90,59,28,.45);display:none;align-items:center;justify-content:center;z-index:5}
#over.show{display:flex}
.card{background:#fff8ec;border:4px solid #e8c48f;border-radius:24px;padding:26px 30px;text-align:center;box-shadow:0 8px 0 #d9a868;min-width:240px}
.card h2{font-size:28px;font-weight:900;margin-bottom:6px}
.card p{font-size:16px;margin:4px 0;font-weight:700}
.card .big{font-size:42px;font-weight:900;color:#e8394a}
button{font:inherit;font-weight:900;font-size:18px;background:#ff9f1c;color:#fff;border:none;border-radius:16px;padding:12px 26px;margin-top:16px;box-shadow:0 4px 0 #c46f00;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c46f00}
#sound{background:#fff8ec;color:#5a3b1c;border:3px solid #e8c48f;box-shadow:0 3px 0 #e8c48f;padding:6px 10px;font-size:18px;margin:0;border-radius:14px}
/* ---- Crew leaderboard widget ---- */
.lbw{margin:12px auto 0;max-width:300px;text-align:center;color:#3b2a1e}
.lbw h3{font-size:16px;font-weight:900;margin:2px 0 8px;letter-spacing:.02em}
.lbw .row{display:flex;gap:6px;margin-bottom:8px}
.lbw input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:800;padding:9px 10px;border-radius:12px;border:3px solid #ffd2a6;background:#fff;color:#3b2a1e;-webkit-user-select:text;user-select:text;touch-action:manipulation;outline:none}
.lbw input:focus{border-color:#ff8a3d}
.lbw button{font:inherit;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:9px 12px;background:#3a86ff;color:#fff;cursor:pointer;box-shadow:none;margin:0;width:auto}
.lbw button:disabled{opacity:.55}
.lbw ol{list-style:none;margin:0;padding:0;background:#fff8ec;border-radius:14px;overflow:hidden;text-align:left}
.lbw li{display:flex;justify-content:space-between;gap:8px;padding:5px 12px;font-size:14px;font-weight:800;border-bottom:1px solid #f2e2cc}
.lbw li:last-child{border-bottom:none}
.lbw li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbw li .r{opacity:.55;min-width:22px;display:inline-block}
.lbw li.me{background:#ffe7c2}
.lbw .msg{font-size:13px;font-weight:800;margin:6px 0;min-height:1em}
.lbw .err{color:#c0392b}
.homebtn{display:inline-block;margin-top:12px;font-weight:900;font-size:15px;color:#a0703a;text-decoration:none}

#over .card{max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="box"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
    <div class="box"><div class="lbl">NEXT</div><div id="nextE"></div></div>
    <div class="box"><div class="lbl">BEST</div><div class="val" id="best">0</div></div>
    <button id="sound" aria-label="Toggle sound">🔊</button>
  </header>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="evo"></div>
</div>
<div id="over"><div class="card">
  <h2>Game Over</h2>
  <p>Score</p>
  <div class="big" id="finalScore">0</div>
  <p id="newBest" style="display:none">🏆 New best!</p>
  <div id="lb"></div>
  <button id="again">Play again</button><br><a class="homebtn" href="../">🏠 All games</a>
</div></div>

<script>
// ---- Crew leaderboard widget (talks to /api/scores) ----
const CrewBoard = (() => {
  const API = '/api/scores';
  const getName = () => { try { return localStorage.getItem('crew-player-name') || ''; } catch(e){ return ''; } };
  const setName = n => { try { localStorage.setItem('crew-player-name', n); } catch(e){} };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function call(method, game, body){
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch(API + (method === 'GET' ? '?game=' + game : ''), {method, signal: ctl.signal, headers: body ? {'content-type': 'application/json'} : undefined, body: body ? JSON.stringify(body) : undefined});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Leaderboard error');
      return j;
    } finally { clearTimeout(t); }
  }
  function list(el, top, me){
    const ol = el.querySelector('ol');
    if (!top.length){ ol.innerHTML = '<li><span class="n">No scores yet. Be the first!</span></li>'; return; }
    ol.innerHTML = top.map((e, i) => `<li class="${me && e.name.toLowerCase() === me.toLowerCase() ? 'me' : ''}"><span class="n"><span class="r">${i+1}.</span> ${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':''}${esc(e.name)}</span><span>${Number(e.score).toLocaleString()}</span></li>`).join('');
  }
  // game: 'merge' | 'jump' | 'adventure'
  function show(containerId, game, score){
    const el = document.getElementById(containerId); if (!el) return;
    el.className = 'lbw';
    el.innerHTML = `<h3>🏆 Leaderboard</h3>
      <div class="row"${score > 0 ? '' : ' style="display:none"'}><input maxlength="14" placeholder="Your name" autocomplete="nickname" enterkeyhint="send"><button>Post</button></div>
      <div class="lbnote" style="font-size:11.5px;opacity:.7;margin:2px 0 4px">Your nickname &amp; score are public. Don't use your real name.</div>
      <div class="msg"></div><ol><li><span class="n">Loading…</span></li></ol>`;
    const input = el.querySelector('input'), btn = el.querySelector('button'), msg = el.querySelector('.msg'), row = el.querySelector('.row');
    input.value = getName();
    ['pointerdown','touchstart','keydown','keyup'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation()));
    call('GET', game).then(j => list(el, j.top || [], getName())).catch(() => {
      el.querySelector('ol').style.display = 'none'; row.style.display = 'none';
      msg.textContent = 'The leaderboard works on the online version of the game.';
    });
    let posted = false;
    const post = async () => {
      if (posted) return;
      const name = input.value.trim();
      if (!name){ msg.innerHTML = '<span class="err">Type a name first</span>'; input.focus(); return; }
      btn.disabled = true; msg.textContent = 'Posting…';
      try {
        const j = await call('POST', game, {game, name, score});
        posted = true; setName(j.name || name); row.style.display = 'none'; input.blur();
        msg.textContent = j.rank ? (j.rank <= 10 ? `You're #${j.rank}! 🎉` : `You're #${j.rank} — keep going!`) : 'Posted!';
        if (j.improved === false) msg.textContent = `Your best (${Number(j.best).toLocaleString()}) is still on the board`;
        list(el, j.top || [], j.name || name);
      } catch(e){ msg.innerHTML = `<span class="err">${esc(e.message || 'Could not post')}</span>`; btn.disabled = false; }
    };
    btn.onclick = post;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') post(); });
  }
  return {show};
})();

</script>

// Precompute geometry per tier (centered on centre of mass)
const GEO = F.map(f => {
  const S = f.r;
  const ps = SHAPES[f.sh].map(([x,y,r]) => ({x:x*S, y:y*S, r:r*S}));
  let m = 0, cx = 0, cy = 0;
  ps.forEach(p => { const a = p.r*p.r; m += a; cx += a*p.x; cy += a*p.y; });
  cx /= m; cy /= m; ps.forEach(p => { p.x -= cx; p.y -= cy; });
  let I = 0, R = 0;
  ps.forEach(p => { const a = p.r*p.r; I += a*(p.r*p.r/2 + p.x*p.x + p.y*p.y); R = Math.max(R, Math.hypot(p.x,p.y) + p.r); });
  return {ps, m, I, R, im: 1/m, iI: 1/I};
});
const PTS = t => (t*(t+1))/2;

// ---------- drawing a piece ----------
function piecePath(c, g, grow=0){
  c.beginPath();
  for (const p of g.ps){ c.moveTo(p.x + p.r + grow, p.y); c.arc(p.x, p.y, p.r + grow, 0, Math.PI*2); }
}
function drawPiece(c, t, a=0, glow=0){
  const g = GEO[t], f = F[t];
  c.save(); c.rotate(a);
  if (glow > 0){ piecePath(c, g, 3.4 + 5*glow); c.fillStyle = `rgba(255,255,255,${.55 + .4*glow})`; c.fill(); }
  piecePath(c, g, 3.4); c.fillStyle = f.c; c.fill();
  piecePath(c, g); c.clip();
  if (f.img.complete && f.img.naturalWidth){
    const iw = f.img.naturalWidth, ih = f.img.naturalHeight, k = Math.min(iw, ih);
    c.drawImage(f.img, (iw-k)/2, (ih-k)/2, k, k, -g.R, -g.R, g.R*2, g.R*2);
  } else { c.fillStyle = f.c; c.fillRect(-g.R, -g.R, g.R*2, g.R*2); }
  c.restore();
}
function icon(t, size){
  const d = Math.min(window.devicePixelRatio || 1, 3), c = document.createElement('canvas');
  c.width = c.height = size*d; c.style.width = c.style.height = size + 'px';
  const x = c.getContext('2d'), g = GEO[t], k = size*d/(2*(g.R+3.5));
  x.setTransform(k, 0, 0, k, size*d/2, size*d/2); drawPiece(x, t);
  return c;
}
function drawEvo(){
  const e = $('evo'); e.innerHTML = '';
  F.forEach((f,i) => { e.appendChild(icon(i, 24)); if (i < F.length-1){ const s = document.createElement('span'); s.className='arrow'; s.textContent='›'; e.appendChild(s); } });
}
function drawNext(){ const n = $('nextE'); n.innerHTML = ''; n.appendChild(icon(next, 30)); }
Promise.all(F.map(f => f.img.decode ? f.img.decode().catch(()=>{}) : Promise.resolve())).then(() => { drawEvo(); drawNext(); });

// ---------- sound ----------
let ac = null, soundOn = true;
function ensureAudio(){ if (!ac){ try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); }
function tone(freq, dur, type='sine', vol=.18){
  if (!ac || !soundOn) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq*1.8, t+dur*.6);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
  } catch(e){}
}
$('sound').onclick = () => { soundOn = !soundOn; $('sound').textContent = soundOn ? '🔊' : '🔇'; };

// ---------- game state ----------
function randTier(){ const r = Math.random(); return r<.3?0:r<.55?1:r<.75?2:r<.9?3:4; }
function reset(){
  bodies = []; parts = []; score = 0; danger = 0; over = false; pressed = false;
  cur = randTier(); next = randTier(); aimX = W/2; canDrop = true;
  $('score').textContent = 0; drawNext();
  $('over').classList.remove('show');
}
function makeBody(t, x, y, vx=0, vy=0, a=0, w=0){
  const g = GEO[t];
  return {t, g, x, y, a, vx, vy, w, s:.55, born: performance.now(), dead:false, wp: g.ps.map(p => ({x:0,y:0,r:p.r}))};
}
function updWP(b){
  const c = Math.cos(b.a), s = Math.sin(b.a);
  b.g.ps.forEach((p,i) => { const q = b.wp[i]; q.x = b.x + p.x*c - p.y*s; q.y = b.y + p.x*s + p.y*c; });
}
function clampAim(t){ const R = GEO[t].R; return Math.max(R, Math.min(W-R, aimX)); }
function drop(){
  if (over || !canDrop || cur === null) return;
  const b = makeBody(cur, clampAim(cur), DROPY, 0, DROP_VY); b.s = 1; bodies.push(b);
  tone(260, .08, 'triangle', .08);
  cur = null; canDrop = false;
  setTimeout(() => { if (over) return; cur = next; next = randTier(); drawNext(); canDrop = true; }, 420);
}
function burst(x, y, color, n){
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 80+Math.random()*220;
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-60, life:.5+Math.random()*.3, c:color, r:2+Math.random()*3}); }
}

// ---------- rigid-body physics (compound circles) ----------
function applyImp(b, px, py, rx, ry){ b.vx += px*b.g.im; b.vy += py*b.g.im; b.w += (rx*py - ry*px)*b.g.iI; }
// n points from A toward B (or toward the static wall when B is null)
function impulse(A, B, rax, ray, rbx, rby, nx, ny){
  const relv = () => {
    const vax = A.vx - A.w*ray, vay = A.vy + A.w*rax;
    const vbx = B ? B.vx - B.w*rby : 0, vby = B ? B.vy + B.w*rbx : 0;
    return [vbx-vax, vby-vay];
  };
  let [rvx, rvy] = relv();
  const vn = rvx*nx + rvy*ny; if (vn >= 0) return;
  const ca = rax*ny - ray*nx, cb = rbx*ny - rby*nx;
  const den = A.g.im + A.g.iI*ca*ca + (B ? B.g.im + B.g.iI*cb*cb : 0);
  const j = -(1+REST)*vn/den;
  applyImp(A, -j*nx, -j*ny, rax, ray); if (B) applyImp(B, j*nx, j*ny, rbx, rby);
  [rvx, rvy] = relv();
  const tx = -ny, ty = nx, vt = rvx*tx + rvy*ty;
  const ta = rax*ty - ray*tx, tb = rbx*ty - rby*tx;
  const dent = A.g.im + A.g.iI*ta*ta + (B ? B.g.im + B.g.iI*tb*tb : 0);
  const jt = Math.max(-MU*j, Math.min(MU*j, -vt/dent));
  applyImp(A, -jt*tx, -jt*ty, rax, ray); if (B) applyImp(B, jt*tx, jt*ty, rbx, rby);
}
function wall(b, p, nx, ny, pen){
  if (ny === 1 && b.vy > 500) b.sq = Math.min(1, b.vy/1200);
  b.x -= nx*pen; b.y -= ny*pen;
  const cx = p.x + nx*p.r, cy = p.y + ny*p.r;
  impulse(b, null, cx-b.x, cy-b.y, 0, 0, nx, ny);
}
function step(dt){
  const h = dt/SUB;
  for (let s=0; s<SUB; s++){
    for (const b of bodies){ b.vy += G*h; b.x += b.vx*h; b.y += b.vy*h; b.a += b.w*h; }
    const merges = [];
    for (let it=0; it<ITER; it++){
      for (const b of bodies) updWP(b);
      for (let i=0;i<bodies.length;i++){
        const A = bodies[i]; if (A.dead) continue;
        for (let j=i+1;j<bodies.length;j++){
          const B = bodies[j]; if (B.dead) continue;
          const dx = B.x-A.x, dy = B.y-A.y, RR = A.g.R + B.g.R + 3;
          if (dx*dx + dy*dy > RR*RR) continue;
          let merged = false;
          for (const pa of A.wp){
            for (const pb of B.wp){
              const same = A.t === B.t, ex = pb.x-pa.x, ey = pb.y-pa.y, R = pa.r+pb.r + (same ? 3 : 0), d2 = ex*ex+ey*ey;
              if (d2 >= R*R || d2 === 0) continue;
              if (same){ A.dead = B.dead = true; merges.push([A,B]); merged = true; break; }
              const d = Math.sqrt(d2), nx = ex/d, ny = ey/d, pen = R-d, tot = A.g.im + B.g.im, k = pen*.85/tot;
              A.x -= nx*k*A.g.im; A.y -= ny*k*A.g.im; B.x += nx*k*B.g.im; B.y += ny*k*B.g.im;
              const cx = pa.x + nx*(pa.r - pen/2), cy = pa.y + ny*(pa.r - pen/2);
              impulse(A, B, cx-A.x, cy-A.y, cx-B.x, cy-B.y, nx, ny);
            }
            if (merged) break;
          }
          if (merged) break;
        }
      }
      for (const b of bodies){
        if (b.dead) continue;
        updWP(b);
        for (const p of b.wp){
          if (p.x - p.r < 0)  wall(b, p, -1, 0, p.r - p.x);
          if (p.x + p.r > W)  wall(b, p,  1, 0, p.x + p.r - W);
          if (p.y + p.r > H)  wall(b, p,  0, 1, p.y + p.r - H);
        }
      }
    }
    for (const [A,B] of merges){
      const x = (A.x+B.x)/2, y = (A.y+B.y)/2, t = A.t+1;
      burst(x, y, F[A.t].c, 10 + A.t*2);
      if (t < F.length){
        const nb = makeBody(t, x, y, (A.vx+B.vx)/2, Math.min(0,(A.vy+B.vy)/2) - 40, A.a, (A.w+B.w)/2);
        nb.born = Math.min(A.born, B.born); bodies.push(nb); addScore(PTS(t));
      } else addScore(100);
      tone(380 + t*45, .18, 'sine', .16);
    }
    if (merges.length) bodies = bodies.filter(b => !b.dead);
    for (const b of bodies){ b.vx *= .9995; b.vy *= .9995; b.w *= .996; b.w = Math.max(-18, Math.min(18, b.w)); }
  }
}
function addScore(n){ score += n; $('score').textContent = score; }
function checkOver(dt){
  const now = performance.now();
  let above = false;
  for (const b of bodies){ if (now - b.born < 1500) continue; updWP(b); if (b.wp.some(p => p.y - p.r < LINE)){ above = true; break; } }
  danger = above ? danger + dt : Math.max(0, danger - dt*2);
  if (danger > 2.5) endGame();
}
function endGame(){
  over = true; cur = null;
  const nb = score > best;
  if (nb){ best = score; try { localStorage.setItem('crew-best', best); } catch(e){} $('best').textContent = best; }
  $('finalScore').textContent = score; $('newBest').style.display = nb ? 'block' : 'none';
  CrewBoard.show('lb', 'merge', score);
  tone(200, .5, 'sawtooth', .08);
  setTimeout(() => $('over').classList.add('show'), 500);
}

// ---------- render ----------
let scale = 1, dpr = 1;
function resize(){
  const st = $('stage').getBoundingClientRect();
  scale = Math.min(st.width / W, st.height / H);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = W*scale + 'px'; cv.style.height = H*scale + 'px';
  cv.width = Math.round(W*scale*dpr); cv.height = Math.round(H*scale*dpr);
}
function render(){
  const base = scale*dpr;
  ctx.setTransform(base, 0, 0, base, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fff6e6'); g.addColorStop(1, '#ffe3b8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const flash = danger > 0 && Math.floor(performance.now()/180)%2 === 0;
  ctx.setLineDash([8, 7]); ctx.lineWidth = 2;
  ctx.strokeStyle = danger > 0 ? (flash ? '#e8394a' : '#ff8a8a') : 'rgba(200,120,60,.45)';
  ctx.beginPath(); ctx.moveTo(0, LINE); ctx.lineTo(W, LINE); ctx.stroke(); ctx.setLineDash([]);
  if (cur !== null && !over){
    const x = clampAim(cur), R = GEO[cur].R;
    ctx.strokeStyle = 'rgba(200,120,60,.35)'; ctx.lineWidth = 2; ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(x, DROPY+R); ctx.lineTo(x, H); ctx.stroke(); ctx.setLineDash([]);
    ctx.save(); ctx.translate(x, DROPY); drawPiece(ctx, cur); ctx.restore();
  }
  const pulse = .5 + .5*Math.sin(performance.now()/160);
  for (const b of bodies){
    b.s += (1-b.s)*.25;
    // landing squash: brief squeeze when hit hard
    if (b.sq > 0) b.sq = Math.max(0, b.sq - .06);
    const sq = b.sq || 0;
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.s*(1+sq*.12), b.s*(1-sq*.12));
    drawPiece(ctx, b.t, b.a, (cur !== null && b.t === cur && !over) ? pulse : 0); ctx.restore();
  }
  for (const p of parts){ ctx.globalAlpha = Math.max(0, p.life*1.6); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
}

// ---------- input ----------
function toX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => { ensureAudio(); pressed = true; aimX = toX(e); try{cv.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
cv.addEventListener('pointermove', e => { if (pressed || e.pointerType === 'mouse') aimX = toX(e); });
cv.addEventListener('pointerup', e => { if (!pressed) return; pressed = false; aimX = toX(e); drop(); });
cv.addEventListener('pointercancel', () => { pressed = false; });
$('again').onclick = () => { ensureAudio(); reset(); };
window.addEventListener('resize', resize);

let last = performance.now();
function loop(t){
  const dt = Math.min(1/30, (t-last)/1000); last = t;
  if (!over){ step(dt); checkOver(dt); }
  for (const p of parts){ p.vy += 900*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  render();
  requestAnimationFrame(loop);
}
reset(); resize(); requestAnimationFrame(loop);
})();

</script>
<script id="crew-consent">
// ---- Crew's Games: privacy notice + consent (shown before first play, re-openable any time) ----
// Stored on this device only. Read the current choice with CrewConsent.get():
//   { v, at, adult, personalizedAds }  — ad code must check personalizedAds before requesting personalized ads.
const CrewConsent = (() => {
  const KEY = 'crew-consent', VERSION = 1;
  const BASE = (() => { const p = location.pathname; return /\/(merge|jump|adventure|privacy)\/?/.test(p) ? '../' : './'; })();
  const get = () => { try { const c = JSON.parse(localStorage.getItem(KEY)); return c && c.v === VERSION ? c : null; } catch(e){ return null; } };
  const set = c => { try { localStorage.setItem(KEY, JSON.stringify({...c, v: VERSION, at: new Date().toISOString()})); } catch(e){} };
  let el = null;
  function open(force){
    if (!force && get()) return;
    if (el) el.remove();
    const cur = get() || {};
    el = document.createElement('div'); el.className = 'cc-wrap';
    el.innerHTML = `<div class="cc-card" role="dialog" aria-modal="true" aria-labelledby="cc-t">
      <div class="cc-paw">🐾</div>
      <h2 id="cc-t">Before you play</h2>
      <p>Crew's Games is free and may show <b>ads</b>. It also has an optional <b>global leaderboard</b>. Here's what that means for your data:</p>
      <ul>
        <li>🎮 <b>Game progress</b> (bones, high scores, settings) is saved <b>on your device only</b>.</li>
        <li>🏆 <b>Leaderboard</b>: only if you choose to post, your nickname and score are stored on our server and shown publicly.</li>
        <li>📢 <b>Ads</b>: ad partners may use cookies or device identifiers. <b>Personalized ads only with your consent</b>; otherwise you'll see non-personalized ads.</li>
        <li>💬 <b>Feedback</b> you send us is only used to improve the games.</li>
      </ul>
      <label class="cc-row"><input type="checkbox" id="cc-age" ${cur.adult === false ? '' : (cur.adult ? 'checked' : '')}> <span>I am <b>16 or older</b> (or have a parent's permission)</span></label>
      <label class="cc-row"><input type="checkbox" id="cc-ads" ${cur.personalizedAds ? 'checked' : ''}> <span>Allow <b>personalized ads</b> (optional)</span></label>
      <div class="cc-btns">
        <button class="cc-b cc-sec" id="cc-min">Only necessary</button>
        <button class="cc-b cc-pri" id="cc-all">Accept all</button>
      </div>
      <button class="cc-b cc-save" id="cc-save">Save my choices</button>
      <p class="cc-fine">By playing you agree to the <a href="${BASE}privacy/#terms" target="_blank" rel="noopener">Terms of Use</a> and acknowledge the <a href="${BASE}privacy/" target="_blank" rel="noopener">Privacy Policy</a>. You can change your choices any time from <b>Privacy choices</b>.</p>
      <button class="cc-link" id="cc-del">Delete my game data on this device</button>
    </div>`;
    document.body.appendChild(el);
    ['pointerdown','touchstart','keydown','keyup'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation()));
    const age = el.querySelector('#cc-age'), ads = el.querySelector('#cc-ads');
    const sync = () => { if (!age.checked){ ads.checked = false; ads.disabled = true; } else ads.disabled = false; };
    age.onchange = sync; sync();
    const done = c => { set(c); el.remove(); el = null; document.dispatchEvent(new CustomEvent('crewconsent', {detail: get()})); };
    el.querySelector('#cc-all').onclick = () => { done({adult: age.checked, personalizedAds: age.checked}); };
    el.querySelector('#cc-min').onclick = () => { done({adult: age.checked, personalizedAds: false}); };
    el.querySelector('#cc-save').onclick = () => { done({adult: age.checked, personalizedAds: age.checked && ads.checked}); };
    el.querySelector('#cc-del').onclick = () => {
      if (el.querySelector('#cc-del').dataset.sure !== '1'){ el.querySelector('#cc-del').dataset.sure = '1'; el.querySelector('#cc-del').textContent = 'Tap again to permanently delete bones, items and scores on this device'; return; }
      try { Object.keys(localStorage).filter(k => /^(crew|crewadv|crewjump|fruitdrop)/.test(k)).forEach(k => localStorage.removeItem(k)); } catch(e){}
      location.reload();
    };
  }
  function link(target){
    const a = document.createElement('button'); a.className = 'cc-open'; a.textContent = '🔒 Privacy choices';
    a.onclick = e => { e.stopPropagation(); open(true); };
    (target || document.body).appendChild(a); return a;
  }
  const css = `.cc-wrap{position:fixed;inset:0;z-index:99;background:rgba(30,20,10,.55);display:flex;align-items:center;justify-content:center;padding:14px;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
.cc-card{background:#fffaf2;color:#3b2a1e;border-radius:22px;max-width:400px;width:100%;max-height:94vh;overflow-y:auto;padding:20px 20px 14px;box-shadow:0 14px 40px rgba(0,0,0,.3);text-align:left;-webkit-overflow-scrolling:touch}
.cc-paw{font-size:30px;text-align:center}.cc-card h2{font-size:22px;font-weight:900;text-align:center;margin:2px 0 8px}
.cc-card p{font-size:14px;line-height:1.45;margin:6px 0;font-weight:600}.cc-card ul{margin:6px 0 10px;padding-left:0;list-style:none}
.cc-card li{font-size:13.5px;line-height:1.4;margin:6px 0;font-weight:600}
.cc-row{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:700;margin:8px 0;cursor:pointer}
.cc-row input{width:20px;height:20px;flex:none;margin-top:1px;-webkit-appearance:checkbox;appearance:auto;accent-color:#ff8a3d}
.cc-btns{display:flex;gap:8px;margin-top:12px}
.cc-b{font:inherit;font-weight:900;font-size:15px;border-radius:14px;padding:11px 8px;cursor:pointer;flex:1;border:none;margin:0;box-shadow:none;width:auto}
.cc-pri{background:#ff8a3d;color:#fff}.cc-sec{background:#fff;color:#3b2a1e;border:2.5px solid #ff8a3d}
.cc-save{display:block;width:100%;margin-top:8px;background:#efe4d6;color:#3b2a1e}
.cc-fine{font-size:12px!important;opacity:.8;text-align:center;margin-top:10px!important}.cc-fine a{color:#c45a12;font-weight:800}
.cc-link{display:block;margin:6px auto 0;background:none;border:none;color:#a0703a;font:inherit;font-size:12px;font-weight:800;text-decoration:underline;cursor:pointer}
.cc-open{font:inherit;font-size:12.5px;font-weight:800;background:none;border:none;color:#a0703a;text-decoration:underline;cursor:pointer;margin:10px auto 0;display:block}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => open(false)); else open(false);
  return {get, open: () => open(true), link};
})();

CrewConsent.link(document.querySelector('#over .card'));
</script>
